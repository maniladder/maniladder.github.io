<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManiLadder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Telugu:ital@0;1&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="hero-copy">
        <h1>
          <img class="wordmark" src="assets/maniladder-logo.png" alt="ManiLadder" width="1200" height="344">
          <span class="hero-tagline">Benchmarking Robot Manipulation Through a <span class="accent-blue">Categorized</span> and <span class="accent-orange">Multi-Level</span> Task Ladder</span>
        </h1>
      </div>
    </div>
  </header>

  <main>
    <section class="intro-section" id="overview" aria-label="Overview">
      <div class="section-heading">
        <h2>Overview</h2>
      </div>
      <div class="intro-video-shell">
        <video class="intro-video" controls preload="metadata" poster="" aria-label="ManiLadder introduction video">
          <source src="videos/video_corl26.mp4" type="video/mp4">
        </video>
        <div class="intro-placeholder">
          <span>ManiLadder overview video</span>
        </div>
      </div>
    </section>

    <div class="section-heading gallery-heading">
      <h2>Task Gallery</h2>
    </div>

    <section class="controls-section" id="task-gallery" aria-label="Gallery controls">
      <label class="search-box">
        <span>Search</span>
        <input id="search-input" type="search" placeholder="Task name, domain, embodiment">
      </label>
      <div class="segmented" id="level-filter" aria-label="Level filter"></div>
      <div class="segmented compact" id="domain-filter" aria-label="Domain filter"></div>
    </section>

    <section class="gallery-section" aria-live="polite">
      <div id="gallery"></div>
    </section>
  </main>

  <script src="data/tasks.js"></script>
  <script src="data/video-status.js"></script>
  <script src="app.js"></script>
</body>
</html>
